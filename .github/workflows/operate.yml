name: clip-operator
on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:
    inputs:
      live: {description: "Post for real", default: "true"}
concurrency: {group: operator, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -U -r requirements.txt
      - name: Cache whisper model
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-base-v1}
      - name: Health check (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_MAIN_BUFFER_CHANNEL_ID: ${{ secrets.YT_MAIN_BUFFER_CHANNEL_ID }}
          TT_MAIN_BUFFER_CHANNEL_ID: ${{ secrets.TT_MAIN_BUFFER_CHANNEL_ID }}
        run: python3 run.py doctor
      - name: Operate
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YT_MAIN_BUFFER_CHANNEL_ID: ${{ secrets.YT_MAIN_BUFFER_CHANNEL_ID }}
          TT_MAIN_BUFFER_CHANNEL_ID: ${{ secrets.TT_MAIN_BUFFER_CHANNEL_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LIVE="--live"
          if [ "${{ vars.OPERATOR_LIVE }}" = "false" ]; then LIVE=""; fi
          python3 run.py cycle $LIVE
      - name: Persist state (queue, learner, logs)
        if: always()
        run: |
          git config user.name "clip-operator" && git config user.email "operator@users.noreply.github.com"
          git add -A state queue logs || true
          git diff --cached --quiet || git commit -qm "operator: cycle $(date -u +%FT%TZ)"
          git pull -q --rebase && git push -q || true
