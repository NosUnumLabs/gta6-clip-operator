name: showcase-test
# In-house engine test on the authorized campaign source (Dom's Kick VODs). Never posts.
# Results go to a DRAFT release (private to repo owners), not to any public branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["showcase_request.txt"]
permissions: {contents: write}
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -U -r requirements.txt
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-base-v1}
      - name: Run showcase
        run: python3 showcase.py
      - name: Upload results to a private draft release
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="showcase-$(date -u +%Y%m%d-%H%M)"
          cat showcase_out/report.json || true
          ls showcase_out/* >/dev/null 2>&1 && gh release create "$TAG" --draft -t "$TAG" -n "private engine test" showcase_out/* || true
