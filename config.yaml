project:
  game: GTA 6
  launch_date: '2026-11-19'
  spoiler_lock_until: '2026-12-10'
  require_human_review: false
  posting_paused_until: '2026-11-24T18:00:00-06:00'  # owner: start posting a few days out
  timezone: America/Chicago
paths:
  input: input
  output: output
  queue: queue
  logs: logs
  font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
detection:
  min_clip_s: 14
  max_clip_s: 30   # breakout streamer clips run 8-25 s (Nov 2026 outliers)
  pre_roll_s: 5
  post_roll_s: 5
  top_n_per_source: 10
  loudness_weight: 0.7
  scene_weight: 0.3
  chat_weight: 0.8
  min_gap_s: 45
render:
  hook_style: banner      # persistent context headline added at publish (reviewer-written)
  impact_sfx: true
  width: 1080
  height: 1920
  layout: auto
  facecam_box:
  - 0
  - 0
  - 0.3
  - 0.3
  hook_seconds: 2.5
  crf: 21
  preset: veryfast
  audio_mode: keep
  replacement_audio: ''
  disclosure_text: ''
captions:
  enabled: true
  font_name: DejaVu Sans
autoreview:
  min_highlight_score: 1.2
  max_letterbox_ratio: 0.5
  max_dup_distance: 10
  min_value: 0.12
  stale_hours: 18
  days_ahead: 1
  max_vods_per_cycle: 2
  candidates_per_vod: 10
  min_reaction_words: 2
  max_big_face_ratio: 0.4
